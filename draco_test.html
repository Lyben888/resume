<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draco decoder local test</title>
  <script type="module" src="https://cdn.jsdelivr.net/gh/lyben888/resume@main/model-viewer.min.js"></script>
</head>
<body style="margin:0; background:#0f172a; display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <model-viewer
    src="car_model.glb"
    alt="电动概念跑车 3D 模型"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="30deg"
    interaction-prompt="none"
    shadow-intensity="1"
    exposure="1.1"
    reveal="auto"
    style="width:600px;height:400px;background:#1e293b;border-radius:12px;">
  </model-viewer>
</body>
</html>
